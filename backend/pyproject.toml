[project]
name = "recipe-film-compare-backend"
version = "0.0.1"
description = "Recipe Film Script 비교 대시보드 backend (FastAPI + asyncio + aioftp + SQLite)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "aioftp>=0.22",
  "sqlalchemy>=2.0",
  "cryptography>=43.0",      # Fernet (FTP 비번 암호화)
  "bcrypt>=4.2",              # 관리자 비번 해시
  "python-multipart>=0.0.12",
  "itsdangerous>=2.2",        # 세션 쿠키 서명
  "chardet>=5.2",             # 인코딩 감지 폴백
  "weasyprint>=63.0; platform_system != 'Windows'",  # PDF export
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
